# Site statique : la racine du dépôt = racine du site (index.html ici).
[build]
  command = "exit 0"
  publish = "."

# Si Netlify affiche encore « Page not found » à la racine après un ZIP :
# tableau de bord Netlify → Site configuration → Build & deploy →
# « Publish directory » : si les fichiers sont dans un sous-dossier, indiquez son nom
# (ex. memoire-presence-site) au lieu de laisser vide ou « . ».
