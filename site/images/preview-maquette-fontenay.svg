<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Aperçu maquette Claire Fontenay (accès libre)">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ef"/>
      <stop offset="1" stop-color="#efe6d8"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf7f2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2c3e41" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2c3e41" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg2)"/>

  <!-- Header -->
  <rect x="60" y="48" width="1080" height="86" rx="18" fill="#ffffff" opacity="0.9" filter="url(#shadow2)"/>
  <rect x="92" y="74" width="210" height="34" rx="10" fill="#3d6b4f" opacity="0.14"/>
  <text x="108" y="98" font-family="Georgia, 'Cormorant Garamond', serif" font-size="18" fill="#2c3e41" opacity="0.9">Mémoire &amp; Présence</text>
  <rect x="880" y="74" width="230" height="34" rx="12" fill="#3d6b4f"/>
  <text x="920" y="98" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" fill="#ffffff">Demander un devis</text>

  <!-- Main card -->
  <rect x="120" y="170" width="960" height="640" rx="28" fill="url(#card2)" filter="url(#shadow2)"/>

  <text x="170" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#6e8870" letter-spacing="0.08em">ACCÈS LIBRE (DÉMO)</text>
  <text x="170" y="285" font-family="Georgia, 'Cormorant Garamond', serif" font-size="46" fill="#2c3e41">Claire Fontenay</text>
  <text x="170" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" fill="#6e8870">Page visible tout de suite  galerie photo + encadré cérémonie (fictif)</text>

  <!-- Portrait -->
  <rect x="170" y="360" width="300" height="225" rx="18" fill="#e9eceb"/>
  <rect x="190" y="378" width="260" height="190" rx="14" fill="#dfe6e1"/>
  <text x="210" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#6e8870">Portrait (aperçu)</text>

  <!-- Editorial blocks -->
  <rect x="510" y="360" width="520" height="120" rx="18" fill="#f3f5f3"/>
  <rect x="540" y="388" width="390" height="12" rx="6" fill="#cfd8d2"/>
  <rect x="540" y="412" width="460" height="12" rx="6" fill="#cfd8d2"/>
  <rect x="540" y="436" width="340" height="12" rx="6" fill="#cfd8d2"/>
  <text x="540" y="468" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="13" fill="#6e8870">Texte / souvenir</text>

  <rect x="510" y="502" width="520" height="120" rx="18" fill="#f3f5f3"/>
  <rect x="540" y="530" width="430" height="12" rx="6" fill="#cfd8d2"/>
  <rect x="540" y="554" width="360" height="12" rx="6" fill="#cfd8d2"/>
  <rect x="540" y="578" width="410" height="12" rx="6" fill="#cfd8d2"/>
  <text x="540" y="610" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="13" fill="#6e8870">Encadré cérémonie</text>

  <!-- Gallery strip -->
  <text x="170" y="655" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" fill="#6e8870">Galerie photo (carrousel)</text>
  <rect x="170" y="680" width="860" height="94" rx="18" fill="#2c3e41" opacity="0.06"/>
  <g opacity="0.8">
    <rect x="190" y="698" width="160" height="58" rx="12" fill="#6e8870" opacity="0.25"/>
    <rect x="366" y="698" width="160" height="58" rx="12" fill="#6e8870" opacity="0.20"/>
    <rect x="542" y="698" width="160" height="58" rx="12" fill="#6e8870" opacity="0.16"/>
    <rect x="718" y="698" width="160" height="58" rx="12" fill="#6e8870" opacity="0.12"/>
    <rect x="894" y="698" width="116" height="58" rx="12" fill="#6e8870" opacity="0.10"/>
  </g>
</svg>
