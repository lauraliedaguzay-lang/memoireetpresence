<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 384" width="288" height="384">
  <rect width="288" height="384" fill="#e8e0d5"/>
  <!-- fond dégradé -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c9ba"/>
      <stop offset="100%" stop-color="#c9bfb2"/>
    </linearGradient>
    <radialGradient id="skin" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d0b8"/>
    </radialGradient>
  </defs>
  <rect width="288" height="384" fill="url(#bg)"/>
  <!-- épaules / buste -->
  <ellipse cx="144" cy="370" rx="115" ry="70" fill="#8b7355"/>
  <!-- cou -->
  <rect x="127" y="250" width="34" height="55" rx="8" fill="url(#skin)"/>
  <!-- visage -->
  <ellipse cx="144" cy="220" rx="72" ry="88" fill="url(#skin)"/>
  <!-- cheveux gris-blanc -->
  <ellipse cx="144" cy="165" rx="78" ry="65" fill="#c8bfb0"/>
  <ellipse cx="76" cy="210" rx="28" ry="55" fill="#c8bfb0"/>
  <ellipse cx="212" cy="210" rx="28" ry="55" fill="#c8bfb0"/>
  <!-- yeux -->
  <ellipse cx="122" cy="215" rx="9" ry="7" fill="#fff"/>
  <ellipse cx="122" cy="215" rx="6" ry="5" fill="#5a4a3a"/>
  <ellipse cx="166" cy="215" rx="9" ry="7" fill="#fff"/>
  <ellipse cx="166" cy="215" rx="6" ry="5" fill="#5a4a3a"/>
  <!-- sourcils -->
  <path d="M113 204 Q122 200 131 204" stroke="#8a7060" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M157 204 Q166 200 175 204" stroke="#8a7060" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- nez -->
  <path d="M144 222 Q140 236 138 240 Q144 244 150 240 Q148 236 144 222" fill="#d4a882" opacity=".5"/>
  <!-- bouche - sourire doux -->
  <path d="M130 258 Q144 268 158 258" stroke="#c08060" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- rides légères pour donner l'âge -->
  <path d="M108 208 Q104 216 108 224" stroke="#c8a888" stroke-width="1" fill="none" opacity=".5"/>
  <path d="M180 208 Q184 216 180 224" stroke="#c8a888" stroke-width="1" fill="none" opacity=".5"/>
  <!-- texte discret en bas -->
  <text x="144" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#fff" opacity=".6">Portrait — maquette</text>
</svg>
